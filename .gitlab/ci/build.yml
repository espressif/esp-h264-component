.build_template: &build_template
  stage: build
  tags:
    - build
  image: ${IMAGE}
  variables:
    # Enable ccache for all build jobs. See configure_ci_environment.sh for more ccache related settings.
    IDF_CCACHE_ENABLE: "1"
    BATCH_BUILD: "1"
    V: "0"
    WARNING_STR: ""

.build_examples_template: &build_examples_template
  <<: *build_template
  artifacts:
    when: always
    paths:
      - "**/build*/size.json"
      - "**/build*/build_log.txt"
      - "**/build*/*.bin"
      # upload to s3 server to save the artifacts size
      - "**/build*/*.map"
      - "**/build*/*.elf"
      - "**/build*/flasher_args.json"
      - "**/build*/flash_project_args"
      - "**/build*/config/sdkconfig.json"
      - "**/build*/bootloader/*.bin"
      - "**/build*/bootloader/*.elf"
      - "**/build*/partition_table/*.bin"
      - size_info.txt
    expire_in: 1 week
  variables:
    IDF_CI_BUILD: "1"
  script:
    - echo "MODIFIED_FILES $MODIFIED_FILES"
    - pip install idf_build_apps==$IDF_BUILD_APPS_VERSION
    - export PEDANTIC_FLAGS="-DIDF_CI_BUILD -Werror -Werror=deprecated-declarations -Werror=unused-variable -Werror=unused-but-set-variable -Werror=unused-function"
    - export EXTRA_CFLAGS="${PEDANTIC_FLAGS} -Wstrict-prototypes"
    - export EXTRA_CXXFLAGS="${PEDANTIC_FLAGS}"
    - python tools/ci/build_apps.py

# ESP32-P4 v3.1+ (ECO5) CI boards require IDF >= 5.5 (v3.x chip revision support).
# Targets: esp32s3 + esp32p4
build_test_v55:
  extends:
    - .build_examples_template
    - .rules:build:test_apps
  variables:
    IMAGE: espressif/idf:release-v5.5
    IDF_BUILD_APPS_VERSION: "1.1.4"
    EXTRA_PREVIEW_TARGETS: ""

# IDF master: adds esp32s31 support.
# Targets: esp32s3 + esp32s31 + esp32p4
build_test_master:
  extends:
    - .build_examples_template
    - .rules:build:test_apps
  variables:
    IMAGE: espressif/idf:latest
    IDF_BUILD_APPS_VERSION: "1.1.4"
    EXTRA_PREVIEW_TARGETS: "esp32s31"
